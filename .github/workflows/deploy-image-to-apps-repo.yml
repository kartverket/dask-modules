name: Deploy image to apps repo

on:
  workflow_call:
    inputs:
      image_url:
        required: true
        type: string
      version_file_name:
        required: true
        type: string
      apps_repo:
        required: true
        type: string
      version_file_directory:
        description: Directory where version file with image ref is stored
        required: false
        default: ./versions
        type: string
      identity:
        required: true
        type: string
      manual_deploy_trigger:
        type: string
        default: false

env:
  REGISTRY: ghcr.io
  APPS_REPO: ${{ inputs.apps_repo }}
  VERSION_FILE_NAME: ${{ inputs.version_file_name }}

jobs:
  deploy-image-to-apps-repo:
    name: Deploy image to apps repo
    runs-on: ubuntu-latest
    env:
      IDENTITY: ${{ inputs.identity }}
    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: kartverket/${{ env.APPS_REPO }}
          identity: ${{ env.IDENTITY }}

      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kartverket/${{ env.APPS_REPO }}
          ref: main
          token: ${{ steps.octo-sts.outputs.token }}
          persist-credentials: false

      - name: Create file
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          VERSION_FILE_DIRECTORY: ${{ inputs.version_file_directory }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          MANUAL_DEPLOY_TRIGGER: ${{ inputs.manual_deploy_trigger }}
        run: |
          setup_directory () {
              DIRECTORY=${VERSION_FILE_DIRECTORY}
              touch $DIRECTORY/${VERSION_FILE_NAME}
              echo "\"${IMAGE_URL}\"" > $DIRECTORY/${VERSION_FILE_NAME} 
          }

          if [[ "${BRANCH}" == "main" ]] || [[ "${MANUAL_DEPLOY_TRIGGER}" == "true" ]]; then
              setup_directory 
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.email "noreply@kartverket.no"
          git config --global user.name "DASK CI"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ${VERSION_FILE_NAME}"
            git push
          fi
