name: Create empty GitHub repo and clone monorepo into it

on:
  repository_dispatch:
    types: [onboarding]

env:
  TARGET_REPO: ${{ github.event.client_payload.target_repo }}
  TEAM_NAME: ${{ github.event.client_payload.team_name }}
  GITHUB_TEAM: ${{ github.event.client_payload.github_team }}

jobs:
  create_and_clone_repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Generate GitHub App token
        id: github_app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Org-wide token is required: this step creates a brand-new org repo
          # (which cannot be pre-scoped via `repositories`) and manages team access.
          owner: kartverket # zizmor: ignore[github-app]
          permission-administration: write
          permission-contents: write
          permission-members: read

      - name: Create empty repo
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ steps.github_app.outputs.token }}
          script: |
            const repoName = process.env.TARGET_REPO;

            try {
              const response = await github.request('POST /orgs/{org}/repos', {
                org: 'kartverket',
                name: repoName,
                description: `data-ingestor-repo for team ${process.env.TEAM_NAME}. Opprinnelig klonet fra https://github.com/kartverket/dataplattform-kom-i-gang.`,
                visibility: 'internal',
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              });
              console.log(`Response for creating repo ${repoName}:`, response);
            } catch (error) {
              if (error.status === 422 && error.response?.data?.errors?.some(e => e.message === 'name already exists on this account')) {
                console.log(`Repo ${repoName} already exists, continuing.`);
              } else {
                throw error;
              }
            }

      - name: Set DASK and product team groups as admin
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ steps.github_app.outputs.token }}
          script: |
            const repoName = process.env.TARGET_REPO;
            const teamSlug = 'dask';
            const response = await github.request('PUT /orgs/{org}/teams/{team_slug}/repos/{owner}/{repo}', {
              org: 'kartverket',
              team_slug: teamSlug,
              owner: 'kartverket',
              repo: repoName,
              permission: 'admin',
              headers: {
                'X-GitHub-Api-Version': '2026-03-10'
              }
            });
            console.log(`Added DASK team to ${repoName}:`, response_dask.status);

            const response_team = await github.request('PUT /orgs/{org}/teams/{team_slug}/repos/{owner}/{repo}', {
              org: 'kartverket',
              team_slug: process.env.GITHUB_TEAM,
              owner: 'kartverket',
              repo: repoName,
              permission: 'admin',
              headers: {
                'X-GitHub-Api-Version': '2026-03-10'
              }
            });
            console.log(`Added ${process.env.GITHUB_TEAM} to ${repoName}:`, response_team.status);

      - name: Get octo-sts token for the template repo
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts-template
        with:
          scope: kartverket/dataplattform-kom-i-gang
          identity: "dask-modules"

      - name: Checkout the reference repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kartverket/dataplattform-kom-i-gang
          ref: main
          token: ${{ steps.octo-sts-template.outputs.token }}
          persist-credentials: false

      - name: Push to a new branch
        run: |
          git config --global user.name "DASK CI"
          git config --global user.email "noreply@kartverket.no"
          rm -rf .git
          git init
          git remote add origin https://x-access-token:${STEPS_GITHUB_APP_OUTPUTS_TOKEN}@github.com/kartverket/${TARGET_REPO}.git
          git fetch origin main && git reset origin/main || true
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push"
          else
            git commit -m "Initial commit"
            git branch -M main
            git push -u origin main
          fi
        env:
          STEPS_GITHUB_APP_OUTPUTS_TOKEN: ${{ steps.github_app.outputs.token }}

  configure-repo:
    needs: create_and_clone_repo
    uses: ./.github/workflows/create-ingestor-pr.yml
    permissions:
      contents: write
      id-token: write
    with:
      payload: ${{ toJson(github.event.client_payload) }}
