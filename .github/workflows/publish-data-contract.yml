name: Publish data contract
on:
    workflow_call:
        inputs:
            workflow_ref:
                description: "The git ref (branch, tag or commit id) of the workflow which you want to run"
                required: true
                type: string
            auth_project_number:
                description: "The GCP Project Number used for authentication. A 12-digit number used as a unique identifier for the project. Used to find workload identity pool."
                required: true
                type: string
            service_account_deploy:
                description: "The GCP service account connected to the identity pool that will be used to deploy the data contract."
                required: true
                type: string
            service_account_compute:
                description: "The GCP service account connected to the identity pool that will be used to validate the data contract against databricks."
                required: true
                type: string
            data_contract_path:
                description: "The path to the directory containing data contract YAML files to publish. Example: src/contracts"
                required: true
                type: string
            environment:
                description: "The target environment for deployment, e.g., 'dev' or 'prod'."
                required: true
                type: string
            publish_data_contract:
                description: "Whether to publish the data contract to Pub/Sub. Set to false to only validate the data contract without publishing."
                required: true
                type: boolean
                default: false
            last_published_ref:
                description: "The git ref (branch, tag or commit id) used to find the last published data contract. Used to find changed data contract files. Example: main"
                required: false
                type: string

permissions:
    id-token: write # Required for Octo STS
    contents: read

jobs:
    get-changed-files:
        runs-on: ubuntu-latest
        outputs:
            changed_files: ${{ steps.changed_contracts.outputs.changed_files }}
        steps:
            - name: Checkout caller repository
              # zizmor: ignore[artipacked] - credentials are needed by the `git fetch origin main` step below
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  ref: ${{ github.ref }}
                  persist-credentials: true

            - name: Get changed contract files
              id: changed_contracts
              run: |
                  git config core.quotepath false
                  git fetch origin main

                  CONTRACT_PATTERN="^${INPUTS_DATA_CONTRACT_PATH}/.*\.(yml|yaml)$"

                  if [[ "${INPUTS_LAST_PUBLISHED_REF}" ]]; then
                    CHANGED_FILES="$(git diff --name-only --diff-filter AMR "${INPUTS_LAST_PUBLISHED_REF}...${GITHUB_REF}" | grep -E "$CONTRACT_PATTERN" || echo '')"
                  elif [[ "${{ github.event_name }}" == 'release' ]]; then
                    PREVIOUS_RELEASE=$(git tag --sort version:refname | tail -n 2 | head -n 1)
                    CURRENT_RELEASE=$(git tag --sort version:refname | tail -n 1 )
                      if [[ "$PREVIOUS_RELEASE" == "$CURRENT_RELEASE" ]]; then
                        CHANGED_FILES="$(git ls-files | grep -E "$CONTRACT_PATTERN" || echo '')"
                      else
                        CHANGED_FILES="$(git diff --name-only --diff-filter AMR "$PREVIOUS_RELEASE...$CURRENT_RELEASE" | grep -E "$CONTRACT_PATTERN" || echo '')"
                      fi
                  elif [[ "${GITHUB_REF_NAME}" == 'main' ]]; then
                    CHANGED_FILES="$(git ls-files | grep -E "$CONTRACT_PATTERN" || echo '')"
                  else
                    CHANGED_FILES="$(git diff --name-only --diff-filter AMR origin/main...HEAD | grep -E "$CONTRACT_PATTERN" || echo '')"
                  fi

                  CHANGED_FILES_COMMA_SEPARATED="$(echo "$CHANGED_FILES" | tr '\n' ',' | sed 's/,$//')"
                  echo "Changed contract files: $CHANGED_FILES_COMMA_SEPARATED"
                  echo "changed_files=$CHANGED_FILES_COMMA_SEPARATED" >> $GITHUB_OUTPUT
              env:
                  INPUTS_LAST_PUBLISHED_REF: ${{ inputs.last_published_ref }}
                  INPUTS_DATA_CONTRACT_PATH: ${{ inputs.data_contract_path }}

    publish-data_contract:
        needs: get-changed-files
        if: needs.get-changed-files.outputs.changed_files != ''
        runs-on: ubuntu-latest
        env:
            COLUMNS: 200
            TOPIC: ${{ inputs.environment == 'prod' && 'projects/dataplattform-prod-9b1d/topics/data-contract-topic' || 'projects/dataplattform-dev-d335/topics/data-contract-topic-test' }}
        steps:
            - name: Checkout caller repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  ref: ${{ github.ref }}
                  persist-credentials: false

            - name: Checkout dask-modules
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  repository: kartverket/dask-modules
                  path: dask-modules
                  ref: ${{ inputs.workflow_ref }}
                  persist-credentials: false

            - name: Create workload identity provider string
              id: create_workload_identity_provider
              run: |
                  PRODUCT_NAME="${INPUTS_SERVICE_ACCOUNT_DEPLOY}"
                  PRODUCT_NAME="${PRODUCT_NAME%%-deploy*}"
                  WORKLOAD_IDENTITY_PROVIDER="projects/${INPUTS_AUTH_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${PRODUCT_NAME}-deploy-pool/providers/github-provider"
                  echo "workload_identity_provider=$WORKLOAD_IDENTITY_PROVIDER" >> $GITHUB_OUTPUT
              env:
                  INPUTS_SERVICE_ACCOUNT_DEPLOY: ${{ inputs.service_account_deploy }}
                  INPUTS_AUTH_PROJECT_NUMBER: ${{ inputs.auth_project_number }}

            - id: google_auth_compute
              name: Authenticate with Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: ${{ steps.create_workload_identity_provider.outputs.workload_identity_provider }}
                  service_account: ${{ inputs.service_account_compute}}

            - name: Setup Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 #v6.3.0
              with:
                  python-version: "3.14"
                  cache: "pip"

            - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
              id: octo-sts
              with:
                  scope: kartverket/kv-datacontracts-validator
                  identity: kartverket_repos

            - name: Validate each changed contract file using kv-datacontract-validator
              run: |
                  pipx install git+https://oauth2:${STEPS_OCTO_STS_OUTPUTS_TOKEN}@github.com/kartverket/kv-datacontracts-validator.git@v1.2.1#subdirectory=datacontract-validator
                  kvdcv --files "${NEEDS_GET_CHANGED_FILES_OUTPUTS_CHANGED_FILES}"
              env:
                  STEPS_OCTO_STS_OUTPUTS_TOKEN: ${{ steps.octo-sts.outputs.token }}
                  NEEDS_GET_CHANGED_FILES_OUTPUTS_CHANGED_FILES: ${{ needs.get-changed-files.outputs.changed_files }}

            - name: Install dependencies
              run: |
                  pip install -r dask-modules/scripts/validate_data_contract/requirements.txt

            - name: Validate data contracts
              run: |
                  python dask-modules/scripts/validate_data_contract/validate_data_contract.py
              env:
                  ENVIRONMENT: ${{ inputs.environment }}
                  SERVICE_ACCOUNT: ${{ inputs.service_account_compute }}
                  CHANGED_DATA_CONTRACTS: ${{ needs.get-changed-files.outputs.changed_files }}

            - id: google_auth_deploy
              name: Authenticate with Google Cloud
              if: inputs.publish_data_contract
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  workload_identity_provider: ${{ steps.create_workload_identity_provider.outputs.workload_identity_provider }}
                  service_account: ${{ inputs.service_account_deploy}}

            - name: "Set up Cloud SDK"
              if: inputs.publish_data_contract
              uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
              with:
                  version: ">= 363.0.0"

            - name: Install mikefarah/yq
              if: inputs.publish_data_contract
              run: |
                  wget https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64 -O /usr/local/bin/yq
                  chmod +x /usr/local/bin/yq

            - name: Publish changed contracts as JSON to Pub/Sub
              if: inputs.publish_data_contract
              run: |
                  IFS=',' read -ra FILES <<< "$CHANGED_DATA_CONTRACTS"
                  for file in "${FILES[@]}"; do
                      [[ -z "$file" ]] && continue

                      echo "Publishing $file"
                      yq -o json '.' "$file" \
                        | jq --arg repo "$GITHUB_REPOSITORY" '{"repository": $repo, "data_contract": .}' \
                        | base64 -w0 \
                        | jq -Rs '{"messages":[{"data": ., "attributes":{"message_type": "data_contract"}}]}' \
                        > ./pubsub_body.json
                      echo "Pub/Sub body: $(cat ./pubsub_body.json)"
                      echo "Publishing to Pub/Sub topic: $TOPIC"

                      curl -X POST \
                        "https://pubsub.googleapis.com/v1/$TOPIC:publish" \
                        -H "Authorization: Bearer $(gcloud auth print-access-token)" \
                        -H "Content-Type: application/json" \
                        -d @pubsub_body.json
                  done
              env:
                  CHANGED_DATA_CONTRACTS: ${{ needs.get-changed-files.outputs.changed_files }}
                  INPUTS_ENVIRONMENT: ${{ inputs.environment }}

            - name: Publish existing data contract ids
              if: inputs.publish_data_contract
              run: |
                  ALL_IDS=$(git ls-files "${INPUTS_DATA_CONTRACT_PATH}" | grep -E "\.(yml|yaml)$" | xargs -I{} yq '.id' {} | jq -Rs '[split("\n")[] | select(length > 0)]')
                  echo "Collected all active data contract IDs: $ALL_IDS"

                  jq -n --arg repo "$GITHUB_REPOSITORY" --argjson ids "$ALL_IDS" '{"repository": $repo, "data_contract_ids": $ids}' \
                    | base64 -w0 \
                    | jq -Rs '{"messages":[{"data": ., "attributes":{"message_type": "active_data_contract_ids"}}]}' \
                    > ./pubsub_body.json

                  echo "Publishing manifest to Pub/Sub topic: $TOPIC"
                  echo "Pub/Sub body: $(cat ./pubsub_body.json)"
                  curl -X POST \
                    "https://pubsub.googleapis.com/v1/$TOPIC:publish" \
                    -H "Authorization: Bearer $(gcloud auth print-access-token)" \
                    -H "Content-Type: application/json" \
                    -d @pubsub_body.json
              env:
                  INPUTS_ENVIRONMENT: ${{ inputs.environment }}
                  INPUTS_DATA_CONTRACT_PATH: ${{ inputs.data_contract_path }}
